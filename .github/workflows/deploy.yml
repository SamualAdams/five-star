name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Build before the backend tests so the asset-serving regression tests,
      # which need a real frontend/dist, actually run instead of skipping.
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Run backend tests
        working-directory: backend
        run: pytest -v

  deploy:
    name: Deploy
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6.0.3

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        id: fly_deploy
        continue-on-error: true
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Start Fly.io machines
        id: fly_start
        if: steps.fly_deploy.outcome == 'success'
        continue-on-error: true
        run: |
          flyctl machine list --app five-star --json \
            | jq -r '.[] | select(.state != "started") | .id' \
            | while read -r machine_id; do
                flyctl machine start "$machine_id" --app five-star
              done
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Verify production health
        id: fly_health
        if: steps.fly_deploy.outcome == 'success' && steps.fly_start.outcome == 'success'
        continue-on-error: true
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 10 https://five-star.fly.dev/health; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Capture Fly.io startup logs
        if: steps.fly_deploy.outcome == 'failure' || steps.fly_start.outcome == 'failure' || steps.fly_health.outcome == 'failure'
        run: flyctl logs --app five-star --no-tail
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Fail unsuccessful deployment
        if: steps.fly_deploy.outcome == 'failure' || steps.fly_start.outcome == 'failure' || steps.fly_health.outcome == 'failure'
        run: exit 1
