<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>five* — Same experience, very different signal</title>
<link rel="stylesheet" href="../shared/frame.css">
<link rel="stylesheet" href="../shared/layouts.css">
<script src="../shared/boot.js"></script>
</head>
<body>
<div class="frame">

  <div class="top">
    <span class="brand">five<span class="mark"></span></span>
    <span class="kicker">Public vs. private</span>
  </div>

  <!-- No .sub here: the two columns are this post's body copy. -->
  <div class="body l-split">
    <h1 class="headline">
      <span class="l1">Same experience.</span>
      <span class="l2">Very different signal.</span>
    </h1>

    <div class="split">
      <div class="col col--problem">
        <p class="col-title">Public review</p>
        <ul>
          <li>Written later</li>
          <li>A score and a comment</li>
          <li>Tied to a public profile</li>
        </ul>
      </div>
      <div class="col col--fix">
        <p class="col-title">Private feedback</p>
        <ul>
          <li>While it is fresh</li>
          <li>Prompted for detail</li>
          <li>Anonymous or named</li>
        </ul>
      </div>
    </div>
  </div>

  <div class="rule"></div>
  <div class="foot">
    <span class="brand">five<span class="mark"></span></span>
    <span class="cta">Better feedback. Better business.</span>
  </div>

</div>
</body>
</html>
