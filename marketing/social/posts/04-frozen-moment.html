<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>five* — A public review is one frozen moment in time</title>
<link rel="stylesheet" href="../shared/frame.css">
<link rel="stylesheet" href="../shared/layouts.css">
<script src="../shared/boot.js"></script>
</head>
<body>
<div class="frame">

  <div class="top">
    <span class="brand">five<span class="mark"></span></span>
    <span class="kicker">Over time</span>
  </div>

  <div class="body l-timeline">
    <h1 class="headline">
      <span class="l1">A public review is one</span>
      <span class="l2"><em>frozen moment</em> in time.</span>
    </h1>

    <div class="timeline">
      <div class="tl-track">
        <span class="tl-dot tl-dot--alert"></span>
        <span class="tl-gap"></span>
        <span class="tl-dot tl-dot--live"></span>
        <span class="tl-span"></span>
        <span class="tl-dot tl-dot--live"></span>
        <span class="tl-span"></span>
        <span class="tl-dot tl-dot--live"></span>
        <span class="tl-span"></span>
        <span class="tl-dot tl-dot--live"></span>
        <span class="tl-span"></span>
        <span class="tl-dot tl-dot--live"></span>
      </div>
      <div class="tl-legend">
        <span class="tl-key tl-key--alert"><i></i>One review, one day</span>
        <span class="tl-key tl-key--live"><i></i>Feedback as things change</span>
      </div>
    </div>

    <p class="sub">
      Customers can come back as their experience changes, so what you&rsquo;re
      looking at stays current.
    </p>
  </div>

  <div class="rule"></div>
  <div class="foot">
    <span class="brand">five<span class="mark"></span></span>
    <span class="cta">Better feedback. Better business.</span>
  </div>

</div>
</body>
</html>
